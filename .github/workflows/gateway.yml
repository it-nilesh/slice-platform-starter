# Platform pipeline: the NGINX gateway + runtime config (manifest, allowlist).
# Registering a slice changes only gateway/config and gateway/conf.d/allowlist.conf,
# which this pipeline validates before anything is deployed.
name: "platform: gateway"

on:
  push:
    branches: [main]
    tags: ["gateway-v*"]
    paths:
      - gateway/**
      - frontend/scripts/validate-manifest.ts
      - frontend/apps/shell/src/manifest/**
      - .github/workflows/gateway.yml
      - .github/actions/**
  pull_request:
    paths:
      - gateway/**
      - frontend/scripts/validate-manifest.ts
      - frontend/apps/shell/src/manifest/**
      - .github/workflows/gateway.yml
      - .github/actions/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Validate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Manifest schema + allowlist consistency
        run: node frontend/scripts/validate-manifest.ts gateway/config/mfe-manifest.json gateway/conf.d/allowlist.conf
      - name: nginx -t
        run: |
          docker build --tag gateway-test gateway
          docker run --rm --add-host shell:127.0.0.1 gateway-test nginx -t

  image:
    name: Image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/container-image
        with:
          component: gateway
          context: gateway
          file: gateway/Dockerfile
          release-tag-prefix: gateway-v
          push: ${{ github.event_name != 'pull_request' }}
          github-token: ${{ github.token }}
