# Pipeline for the "orders" vertical slice (orders-api + mfe-orders).
# GENERATED by ./slice from tools/slice/templates. Regenerate with: ./slice ci orders
#
#   pull request      -> test + build + scan the changed half (nothing pushed)
#   push to main      -> same, then push sha-<short> + main tags to GHCR
#   tag orders-v1.2.0 -> build both halves, push 1.2.0 tags (a release)
name: "slice: orders"

on:
  push:
    branches: [main]
    tags: ["orders-v*"]
    paths:
      - backend/src/Services/Orders/**
      - backend/tests/Orders.Api.Tests/**
      - backend/src/BuildingBlocks/**
      - backend/Directory.Build.props
      - backend/global.json
      - .github/workflows/_build-dotnet-service.yml
      - frontend/apps/mfe-orders/**
      - frontend/packages/**
      - frontend/package-lock.json
      - frontend/tsconfig.base.json
      - frontend/Dockerfile
      - frontend/nginx/remote.conf
      - .github/workflows/_build-mfe.yml
      - .github/workflows/slice-orders.yml
      - .github/actions/**
  pull_request:
    paths:
      - backend/src/Services/Orders/**
      - backend/tests/Orders.Api.Tests/**
      - backend/src/BuildingBlocks/**
      - backend/Directory.Build.props
      - backend/global.json
      - .github/workflows/_build-dotnet-service.yml
      - frontend/apps/mfe-orders/**
      - frontend/packages/**
      - frontend/package-lock.json
      - frontend/tsconfig.base.json
      - frontend/Dockerfile
      - frontend/nginx/remote.conf
      - .github/workflows/_build-mfe.yml
      - .github/workflows/slice-orders.yml
      - .github/actions/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice-orders-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Release tags and manual runs skip detection and build both halves.
      api: ${{ steps.filter.outputs.api || 'true' }}
      mfe: ${{ steps.filter.outputs.mfe || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        with:
          filters: |
            api:
              - backend/src/Services/Orders/**
              - backend/tests/Orders.Api.Tests/**
              - backend/src/BuildingBlocks/**
              - backend/Directory.Build.props
              - backend/global.json
              - .github/workflows/_build-dotnet-service.yml
              - .github/workflows/slice-orders.yml
              - .github/actions/**
            mfe:
              - frontend/apps/mfe-orders/**
              - frontend/packages/**
              - frontend/package-lock.json
              - frontend/tsconfig.base.json
              - frontend/Dockerfile
              - frontend/nginx/remote.conf
              - .github/workflows/_build-mfe.yml
              - .github/workflows/slice-orders.yml
              - .github/actions/**

  api:
    name: orders-api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/_build-dotnet-service.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      component: orders-api
      dockerfile: backend/src/Services/Orders/Orders.Api/Dockerfile
      test-project: backend/tests/Orders.Api.Tests
      release-tag-prefix: orders-v
      push: ${{ github.event_name != 'pull_request' }}

  mfe:
    name: mfe-orders
    needs: changes
    if: needs.changes.outputs.mfe == 'true'
    uses: ./.github/workflows/_build-mfe.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      app: mfe-orders
      public-path: /mfe/orders
      nginx-conf: remote.conf
      component: mfe-orders
      release-tag-prefix: orders-v
      push: ${{ github.event_name != 'pull_request' }}
