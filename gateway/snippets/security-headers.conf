# Shared security headers. Included at server level and in every location that
# sets its own add_header (nginx does not merge add_header across levels).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Request-ID $req_id always;
# Enable once TLS terminates here or at the load balancer in front:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
