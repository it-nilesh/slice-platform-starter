# =============================================================================
#  Gateway allowlist (deny by default).
#
#  Routing is convention based (/mfe/<name>/ -> mfe-<name>, /api/<name>/ ->
#  <name>-api), but only names listed here are reachable from outside.
#  Adding a slice = add a line + `nginx -s reload`. No image rebuild needed.
#  In Kubernetes this file is a ConfigMap.
# =============================================================================

map $mfe_name $mfe_allowed {
    default  0;
    catalog  1;
    orders   1;
    profile  1;
}

map $svc_name $api_allowed {
    default  0;
    catalog  1;
    orders   1;
    profile  1;
}
