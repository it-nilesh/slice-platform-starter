# =============================================================================
#  API / Edge Gateway: the ONLY public entry point.
#
#    /                          -> shell         (host SPA)
#    /config/mfe-manifest.json  -> served here   (runtime MFE registry)
#    /mfe/<name>/*              -> mfe-<name>    (remote bundle)
#    /api/<name>/*              -> <name>-api    (.NET microservice)
#
#  <name> must be listed in allowlist.conf (deny by default).
#
#  Everything is same-origin from the browser's point of view, so no CORS.
#  This file is included inside the `http {}` block of the stock nginx.conf.
# =============================================================================

# Docker's embedded DNS. Upstreams are resolved per request (via variables)
# so the gateway starts even if a service is down, and follows container restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

log_format json_combined escape=json
  '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration":$request_time,'
  '"upstream":"$upstream_addr","upstream_duration":"$upstream_response_time",'
  '"user_agent":"$http_user_agent"}';

# Propagate an incoming correlation id, or mint one.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Per-client rate limit for API traffic.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log json_combined;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Security headers (snippet is re-included wherever a location adds its own headers,
    #     because add_header in a location replaces the inherited set) -------------------
    include /etc/nginx/snippets/security-headers.conf;

    # --- Common proxy settings -----------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Request-ID      $req_id;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_next_upstream error timeout http_502 http_503;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # --- Runtime config (MFE manifest) ---------------------------------------
    # Mounted from ./config; always revalidated (ETag) so edits apply immediately.
    location = /config/mfe-manifest.json {
        root /usr/share/nginx;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /config/ {
        return 404;
    }

    # --- Backend microservices: /api/<name>/* -> <name>-api ------------------
    location ~ "^/api/(?<svc_name>[a-z][a-z0-9-]{0,29})(/|$)" {
        if ($api_allowed = 0) {
            return 404;
        }
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://$svc_name-api:8080;
    }

    location /api/ {
        return 404;
    }

    # --- Microfrontends: /mfe/<name>/* -> mfe-<name> ------------------------
    location ~ "^/mfe/(?<mfe_name>[a-z][a-z0-9-]{0,29})/" {
        if ($mfe_allowed = 0) {
            return 404;
        }
        proxy_pass http://mfe-$mfe_name:8080;
    }

    location /mfe/ {
        return 404;
    }

    # Allowlisted but not running (DNS miss / connection refused) -> 503, not a raw 502.
    error_page 502 504 = @unavailable;
    location @unavailable {
        types { }  # ignore the URL extension (e.g. .js) when choosing Content-Type
        default_type application/problem+json;
        add_header Retry-After 10 always;
        include /etc/nginx/snippets/security-headers.conf;
        return 503 '{"title":"Service Unavailable","status":503,"detail":"The requested service is not available. Try again shortly."}';
    }

    error_page 404 = @not_found;
    location @not_found {
        types { }
        default_type application/problem+json;
        include /etc/nginx/snippets/security-headers.conf;
        return 404 '{"title":"Not Found","status":404,"detail":"No route matches this path."}';
    }

    # --- Shell (catch-all; SPA routing is handled by the shell container) ----
    location / {
        set $shell http://shell:8080;
        proxy_pass $shell;
    }
}
