# Static host for a remote microfrontend (sits behind the gateway).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # remoteEntry.js has a stable name; always revalidate so the shell
    # picks up a new deployment of this MFE without being rebuilt.
    location ~ /remoteEntry\.js$ {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location /mfe/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
}
